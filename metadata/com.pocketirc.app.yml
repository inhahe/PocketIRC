# F-Droid build recipe for Pocket IRC.
#
# To submit: copy this file to `metadata/com.pocketirc.app.yml` in a fork of
# https://gitlab.com/fdroid/fdroiddata and open a merge request. It lives here
# so it is reviewed alongside the code. The store listing itself (name,
# descriptions, changelogs) is in fastlane/metadata/android/, which F-Droid
# reads from this repository.
#
# The first Builds entry must name a tag that exists on GitHub and contains the
# F-Droid build settings (dependenciesInfo / vcsInfo in app/build.gradle.kts),
# i.e. v0.9.2 or later. After acceptance, F-Droid finds new versions by itself
# from new v* tags (AutoUpdateMode / UpdateCheckMode below).

Categories:
  - Messaging
  - Internet
License: MIT
AuthorName: Pocket IRC contributors
SourceCode: https://github.com/inhahe/pocketirc
IssueTracker: https://github.com/inhahe/pocketirc/issues
Changelog: https://github.com/inhahe/pocketirc/releases

AutoName: Pocket IRC

RepoType: git
Repo: https://github.com/inhahe/pocketirc.git

Builds:
  - versionName: 0.9.2
    versionCode: 7
    commit: v0.9.2
    subdir: app
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.9.2
CurrentVersionCode: 7
